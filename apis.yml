aid: photonic
name: Photonic
description: >-
  Photonic Inc. is a Vancouver, British Columbia deep-tech company founded in 2016 by Dr. Stephanie
  Simmons and led by CEO Dr. Paul Terry, building distributed, fault-tolerant quantum computing and
  quantum networking on silicon T centre spin-photon qubits. Its "Entanglement First" architecture
  couples qubits that compute, store and emit telecom-band photons natively, so individual modules can
  be entangled over ordinary telecom fibre rather than scaled inside a single dilution refrigerator,
  and its SHYPS QLDPC error-correction codes cut the physical-qubit overhead of fault tolerance.
  Backed by Microsoft, British Columbia Investment Management Corp, RBC and TELUS, selected for Stage B
  of DARPA's Quantum Benchmarking Initiative, and intending to deliver quantum computing through Azure
  and private systems. As of this profile Photonic is pre-commercial from an integration standpoint: it
  publishes no API, SDK, developer portal or machine-readable contract of any kind.
